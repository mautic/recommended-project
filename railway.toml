# Railway deployment configuration for Mautic 6
# Alternative to railway.json for more advanced configuration

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "/app/docker-entrypoint.sh"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
healthcheckPath = "/s/login"
healthcheckTimeout = 300
numReplicas = 1

[deploy.healthcheck]
path = "/s/login"
timeout = 300
interval = 30

[observability]
# Enable Railway's observability features
enabled = true
