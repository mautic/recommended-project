<VirtualHost *:80>
    ServerAdmin admin@inboxsos.com
    DocumentRoot /var/www/html/docroot

    <Directory /var/www/html/docroot>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # Enable .htaccess overrides for Mautic
        <IfModule mod_rewrite.c>
            RewriteEngine On
        </IfModule>
    </Directory>

    # Deny access to sensitive directories
    <DirectoryMatch "/\.git">
        Require all denied
    </DirectoryMatch>

    <DirectoryMatch "/(vendor|var|bin)">
        Require all denied
    </DirectoryMatch>

    # Security headers
    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set X-XSS-Protection "1; mode=block"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
    </IfModule>

    # Enable compression
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css text/javascript application/javascript application/json
    </IfModule>

    # Browser caching for static assets
    <IfModule mod_expires.c>
        ExpiresActive On
        ExpiresByType image/jpg "access plus 1 year"
        ExpiresByType image/jpeg "access plus 1 year"
        ExpiresByType image/gif "access plus 1 year"
        ExpiresByType image/png "access plus 1 year"
        ExpiresByType image/webp "access plus 1 year"
        ExpiresByType text/css "access plus 1 month"
        ExpiresByType application/javascript "access plus 1 month"
        ExpiresByType application/font-woff "access plus 1 year"
        ExpiresByType application/font-woff2 "access plus 1 year"
    </IfModule>

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/mautic-error.log
    CustomLog ${APACHE_LOG_DIR}/mautic-access.log combined

    # Set environment variables for Railway
    PassEnv DATABASE_URL
    PassEnv REDIS_URL
    PassEnv MAUTIC_DB_HOST
    PassEnv MAUTIC_DB_PORT
    PassEnv MAUTIC_DB_NAME
    PassEnv MAUTIC_DB_USER
    PassEnv MAUTIC_DB_PASSWORD
    PassEnv MAUTIC_TRUSTED_PROXIES
    PassEnv MAUTIC_SECRET_KEY
</VirtualHost>
